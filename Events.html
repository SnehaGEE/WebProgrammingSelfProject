<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Research Events | VIT</title>
<style>
:root { --primary: #0b3c5d; --accent: #328cc1; }
body { font-family: 'Inter', sans-serif; background: #f4f7fb; margin: 0; }
.event-hero { background: linear-gradient(45deg, var(--primary), var(--accent)); color: white; padding: 80px 20px; text-align: center; }
.container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
.event-row { display: flex; gap: 20px; background: white; margin-bottom: 20px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.event-date { background: #f8fafc; padding: 25px; text-align: center; min-width: 100px; border-right: 1px solid #edf2f7; }
.event-date h2 { color: var(--accent); margin: 0; }
.event-info { padding: 25px; flex: 1; }
.event-info h3 { color: var(--primary); margin-bottom: 8px; }
.btn-reg { display: inline-block; padding: 8px 16px; background: var(--primary); color: white; text-decoration: none; border-radius: 5px; font-size: 12px; margin-top: 15px; }
</style>
</head>
<body>
<div class="event-hero">
    <h1>Conferences & Seminars</h1>
    <p>Join the conversation with global research leaders.</p>
</div>
<div class="container">
    <div class="event-row">
        <div class="event-date"><h2>15</h2><span>DEC</span></div>
        <div class="event-info">
            <h3>International Conference on Green Energy (ICGE 2026)</h3>
            <p style="font-size:14px; color:#64748b;">Anna Auditorium | 10:00 AM - 05:00 PM</p>
            <a href="#" class="btn-reg">Register Now</a>
        </div>
    </div>
    <div class="event-row">
        <div class="event-date"><h2>02</h2><span>JAN</span></div>
        <div class="event-info">
            <h3>Workshop: Writing High-Impact Scopus Papers</h3>
            <p style="font-size:14px; color:#64748b;">Online Webinar (Zoom)</p>
            <a href="#" class="btn-reg">Get Details</a>
        </div>
    </div>
</div>
</body>
</html>
