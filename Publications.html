<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Publications | VIT Research</title>

<style>
:root {
  --primary: #0b3c5d;
  --accent: #328cc1;
  --bg: #f4f7fb;
  --card: #ffffff;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  padding-bottom: 50px;
}

header {
  background: var(--primary);
  color: white;
  padding: 60px 24px;
  text-align: center;
}

.container {
  max-width: 1100px;
  margin: -30px auto 40px;
  background: var(--card);
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.view-badge {
    display: inline-block;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 20px;
    text-transform: uppercase;
}

.public-mode { background: #e0f2fe; color: #0369a1; }
.personal-mode { background: #dcfce7; color: #166534; }

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  text-align: left;
  padding: 15px;
  background: #f8fafc;
  border-bottom: 2px solid #e5e7eb;
}

td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }

.btn-back {
    text-decoration: none;
    color: var(--accent);
    font-weight: 600;
    font-size: 14px;
    display: inline-block;
    margin-bottom: 20px;
}
</style>
</head>
<body>

<header>
  <h1 id="pageTitle">Research Publications</h1>
  <p id="pageSubTitle">Exploring Scholarly Excellence at VIT</p>
</header>

<div class="container">
  <a href="dashboard.html" class="btn-back" id="backLink">← Back</a>
  <br>
  <div id="modeBadge" class="view-badge">View Mode</div>
  
  <table id="pubTable">
    <thead>
      <tr>
        <th>Title</th>
        <th>Author(s)</th>
        <th>Year</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      </tbody>
  </table>
</div>

<script>
  // THE LOGIC: Checking the URL for ?view=personal or ?view=public
  const urlParams = new URLSearchParams(window.location.search);
  const viewMode = urlParams.get('view');

  const title = document.getElementById('pageTitle');
  const subTitle = document.getElementById('pageSubTitle');
  const badge = document.getElementById('modeBadge');
  const tableBody = document.getElementById('tableBody');
  const backLink = document.getElementById('backLink');

  if (viewMode === 'personal') {
    // PERSONAL VIEW (FROM DASHBOARD)
    title.innerText = "My Research Portfolio";
    subTitle.innerText = "Tracking your personal academic contributions";
    badge.innerText = "Personal Dashboard View";
    badge.className = "view-badge personal-mode";
    backLink.href = "dashboard.html";
    
    tableBody.innerHTML = `
      <tr><td>Optimizing Neural Networks for Edge Computing</td><td>Aravind S. (You)</td><td>2025</td><td>Published</td></tr>
      <tr><td>Real-time IoT Data Encryption</td><td>Aravind S. (You)</td><td>2024</td><td>Under Review</td></tr>
    `;
  } else {
    // PUBLIC VIEW (FROM LANDING PAGE)
    title.innerText = "VIT Global Publications";
    subTitle.innerText = "Showcasing high-impact research from the Vellore campus";
    badge.innerText = "Public Repository";
    badge.className = "view-badge public-mode";
    backLink.href = "index.html"; // Goes back to landing page

    tableBody.innerHTML = `
      <tr><td>Sustainable Hydrogel Synthesis</td><td>Dr. Rajesh Kumar</td><td>2024</td><td>Patent Filed</td></tr>
      <tr><td>Blockchain in Healthcare</td><td>Dr. Sarah Thomas</td><td>2025</td><td>Published</td></tr>
      <tr><td>AI in Cancer Imaging</td><td>Dr. Aruna Devi</td><td>2025</td><td>Top Cited</td></tr>
    `;
  }
  
</script>

</body>
</html>
