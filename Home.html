<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VIT Research | Login</title>

<style>
:root {
  --primary: #0b3c5d;
  --accent: #328cc1;
  --bg: #f4f7fb;
  --card: rgba(255, 255, 255, 0.85); /* Glass effect */
  --text: #1d2731;
  --muted: #6b7280;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden; /* Keeps the blobs contained */
}

/* ===== ANIMATED BACKGROUND ===== */
.bg-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

.blob {
  position: absolute;
  width: 500px;
  height: 500px;
  background: linear-gradient(135deg, var(--accent), #7dd3fc);
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.4;
  transition: transform 0.2s ease-out; /* For mouse parallax */
}

.blob.one { top: -10%; left: -5%; animation: float 15s infinite alternate; }
.blob.two { bottom: -10%; right: -5%; animation: float 20s infinite alternate-reverse; }

@keyframes float {
  from { transform: translate(0, 0) scale(1); }
  to { transform: translate(100px, 50px) scale(1.1); }
}

/* ===== HEADER ===== */
header {
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(0,0,0,0.05);
  z-index: 10;
}

header h1 { 
  font-size: 20px; 
  color: var(--primary); 
  font-weight: 800;
}

.lang-toggle {
  font-size: 13px;
  font-weight: 600;
  color: var(--primary);
  cursor: pointer;
  border: 1px solid var(--primary);
  padding: 5px 12px;
  border-radius: 20px;
  transition: 0.3s;
}

.lang-toggle:hover {
  background: var(--primary);
  color: white;
}

/* ===== LOGIN WRAPPER ===== */
.login-wrapper {
  flex: 1;
  max-width: 1100px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
  padding: 24px;
  z-index: 5;
}

.login-info h2 {
  font-size: 48px;
  color: var(--primary);
  line-height: 1.1;
  margin-bottom: 20px;
}

.login-info p {
  font-size: 18px;
  color: var(--muted);
  line-height: 1.6;
}

/* ===== LOGIN CARD (GLASS) ===== */
.login-card {
  background: var(--card);
  padding: 45px;
  border-radius: 24px;
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
  transform: translateY(0);
  animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
  from { transform: translateY(50px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.login-card h3 {
  color: var(--primary);
  font-size: 24px;
  margin-bottom: 30px;
}

.input-group {
  margin-bottom: 20px;
}

.login-card input {
  width: 100%;
  padding: 14px 18px;
  border-radius: 12px;
  border: 2px solid transparent;
  background: rgba(0, 0, 0, 0.04);
  font-size: 16px;
  transition: 0.3s;
  outline: none;
}

.login-card input:focus {
  border-color: var(--accent);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(50, 140, 193, 0.1);
}

.login-card button {
  width: 100%;
  padding: 15px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.3s;
  margin-top: 10px;
}

.login-card button:hover {
  background: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(50, 140, 193, 0.3);
}

.login-card p {
  margin-top: 25px;
  text-align: center;
  font-size: 14px;
  color: var(--muted);
}

.login-card a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}

.login-card a:hover { text-decoration: underline; }

/* RESPONSIVE */
@media (max-width: 900px) {
  .login-wrapper { grid-template-columns: 1fr; text-align: center; }
  .login-info { display: none; } /* Focus on form for mobile */
}
</style>
</head>

<body>

<div class="bg-container">
  <div class="blob one" id="blob1"></div>
  <div class="blob two" id="blob2"></div>
</div>

<header>
  <h1>VIT Research Portal</h1>
  <div class="lang-toggle">English | മലയാളം</div>
</header>

<section class="login-wrapper">

  <div class="login-info">
    <h2>Access the <br><span style="color:var(--accent)">Research Hub</span></h2>
    <p>
      Connect with the collective intelligence of VIT Vellore’s faculty, scholars, and global research partners.
    </p>
  </div>

  <div class="login-card">
    <h3>Sign In</h3>
    <div class="input-group">
      <input type="email" id="email" placeholder="University Email Address">
    </div>
    <div class="input-group">
      <input type="password" id="password" placeholder="Password">
    </div>
    <button id="loginBtn" onclick="login()">Enter Dashboard</button>

    <p>
      Don’t have an account?
      <a href="signup.html">Create Account</a>
    </p>
  </div>

</section>

<script>
// Parallax Mouse Effect for Blobs
document.addEventListener('mousemove', (e) => {
  const x = e.clientX / window.innerWidth;
  const y = e.clientY / window.innerHeight;
  
  document.getElementById('blob1').style.transform = `translate(${x * 50}px, ${y * 50}px)`;
  document.getElementById('blob2').style.transform = `translate(${x * -50}px, ${y * -50}px)`;
});

// Login Simulation
function login() {
  const btn = document.getElementById('loginBtn');
  btn.innerText = "Authenticating...";
  btn.style.opacity = "0.7";
  
  setTimeout(() => {
    window.location.href = "dashboard.html";
  }, 1200);
}
</script>

</body>
</html>
